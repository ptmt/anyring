name: iOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to TestFlight after the build checks pass
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Stable version published in the actions/runner-images macos-26 inventory.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    name: Build iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check distribution configuration
        run: |
          xcodebuild -version
          python3 -m unittest discover -s ci/tests -v
          bash -n ci/testflight.sh
      - name: Build for simulator
        run: |
          xcodebuild -project AnyRing/AnyRing.xcodeproj -scheme 'AnyRing (iOS)' \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check Release archive
        run: |
          xcodebuild -project AnyRing/AnyRing.xcodeproj -scheme 'AnyRing (iOS)' \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AnyRing.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive

  testflight:
    name: Upload to TestFlight
    needs: build
    # PRs (including forks) never enter the environment or receive signing secrets.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: macos-26
    timeout-minutes: 40
    environment: testflight
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sign, archive, and upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_APP_BASE64: ${{ secrets.APPLE_PROFILE_APP_BASE64 }}
          APPLE_PROFILE_WIDGET_BASE64: ${{ secrets.APPLE_PROFILE_WIDGET_BASE64 }}
          APPLE_PROFILE_WATCH_BASE64: ${{ secrets.APPLE_PROFILE_WATCH_BASE64 }}
          APPLE_PROFILE_WATCH_WIDGET_BASE64: ${{ secrets.APPLE_PROFILE_WATCH_WIDGET_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash ci/testflight.sh
      - name: Save debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dSYMs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/AnyRing.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 30
