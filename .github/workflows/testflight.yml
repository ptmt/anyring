name: iOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      publish:
        description: Upload to TestFlight after the build checks pass
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Xcode 27 is required: Swift 6.3.3 in Xcode 26.6 crashes in IRGen on MainScreen.swift.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    name: Build iOS
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check distribution configuration
        run: |
          xcodebuild -version
          python3 -m unittest discover -s ci/tests -v
          bash -n ci/testflight.sh ci/cleanup.sh
      - name: Build for simulator
        run: |
          xcodebuild -project AnyRing/AnyRing.xcodeproj -scheme 'AnyRing (iOS)' \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check Release archive
        run: |
          xcodebuild -project AnyRing/AnyRing.xcodeproj -scheme 'AnyRing (iOS)' \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AnyRing.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Test app, widgets, and navigation
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')"
          xcodebuild -project AnyRing/AnyRing.xcodeproj -scheme 'AnyRing (iOS)' \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/ios-tests" CODE_SIGNING_ALLOWED=NO test
      - name: Test Release HealthKit callback delivery
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')"
          xcodebuild -project AnyRing/AnyRing.xcodeproj -scheme 'AnyRing (iOS)' \
            -configuration Release -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/ios-tests" \
            -only-testing:AnyRingTests/BackgroundHealthDeliveryTests \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test

  testflight:
    name: Upload to TestFlight
    needs: build
    # PRs (including forks) never enter the environment or receive signing secrets.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: xcode-27
    timeout-minutes: 40
    environment: testflight
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Sign, archive, and upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_APP_BASE64: ${{ secrets.APPLE_PROFILE_APP_BASE64 }}
          APPLE_PROFILE_WIDGET_BASE64: ${{ secrets.APPLE_PROFILE_WIDGET_BASE64 }}
          APPLE_PROFILE_WATCH_BASE64: ${{ secrets.APPLE_PROFILE_WATCH_BASE64 }}
          APPLE_PROFILE_WATCH_WIDGET_BASE64: ${{ secrets.APPLE_PROFILE_WATCH_WIDGET_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash ci/testflight.sh
      - name: Clean signing credentials
        if: always()
        run: bash ci/cleanup.sh "${ANYRING_SIGNING_DIR:-}"
